name: 'Docker'

on:
  push:
    branches:
      - main

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v6
      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v4
      - name: 'Setup Docker Buildx'
        uses: docker/setup-buildx-action@v4
      - name: 'Login to Docker Hub'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 'Docker metadata'
        id: docker_metadata_step_id
        uses: docker/metadata-action@v6
        with:
          images: |
            gw2auth/http-echo
            ghcr.io/gw2auth/http-echo
          tags: |
            type=schedule
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            latest
      - name: 'Build and push'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/s390x
          push: true
          tags: ${{ steps.docker_metadata_step_id.outputs.tags }}
          labels: ${{ steps.docker_metadata_step_id.outputs.labels }}
